<!DOCTYPE html>
<html lang="en">

<head>
    <title>Modal, Tooltip, Popover,Carousel anim,Progress bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img1.jpg" alt="Image one" class="d-block w-100 h-25">
            </div>
            <div class="carousel-item">
                <img src="img2.jpg" alt="Image Two" class="d-block w-100 h-25">
            </div>
            <div class="carousel-item">
                <img src="img3.jpg" alt="Image Two" class="d-block w-100 h-25">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button type="button" class="carousel-control-next" data-bs-target="#myCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <br><br>
    <button class="btn btn-primary m-3" data-bs-toggle="modal" data-bs-target="#myModal">Open Form</button>
    <div class="modal fade" id="myModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-2">
                <div class="modal-header" style="margin-top: -10px;">
                    <h3 class="modal-title">Login Form</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body mb-3 px-4">
                    <form>
                        <label for="Unm" class="form-label">Username: </label>
                        <input type="text" class="form-control">

                        <label for="Pass" class="form-label">Password: </label>
                        <input type="text" class="form-control">
                    </form>
                </div>
                <div class="modal-footer">
                    <a id="btnCancel" class="btn btn-success" href="#" data-bs-dismiss="modal"
                        onclick="alert(`Form Submitted successfully`);">Submit</a>
                    <a id="btnCancel" class="btn btn-danger" href="#" data-bs-dismiss="modal">Close</a>
                </div>
            </div>
        </div>
    </div>

    <br><br>
    <div class="text-center gap-5">
        <button type="button" class="btn btn-primary" data-bs-toggle="tooltip" title="Tooltip Top"
            data-bs-placement="top">Hover Me!</button>
        <button type="button" class="btn btn-primary " data-bs-toggle="tooltip" title="Tooltip Bottom"
            data-bs-placement="bottom">Hover Me!</button>
        <button type="button" class="btn btn-primary " data-bs-toggle="tooltip" title="Tooltip Left"
            data-bs-placement="left">Hover Me!</button>
        <button type="button" class="btn btn-primary " data-bs-toggle="tooltip" title="Tooltip Right"
            data-bs-placement="right">Hover Me!</button>
    </div>
    <br><br>
    <div class="text-center">
        <button type="button" class="btn btn-primary" data-bs-toggle="popover" title="Popover Top"
            onclick="progressClick()" data-bs-placement="top"
            data-bs-content="This is demo of popover and Toggle button to display and hide this.">Toggle
            Me!</button>
        <button type="button" class="btn btn-primary" data-bs-toggle="popover" title="Popover Bottom"
            onclick="progressClick()" data-bs-placement="bottom"
            data-bs-content="This is demo of popover and Toggle button to display and hide this.">Toggle
            Me!</button>

        <button type="button" class="btn btn-primary" data-bs-toggle="popover" title="Popover Left"
            onclick="progressClick()" data-bs-placement="left"
            data-bs-content="This is demo of popover and Toggle button to display and hide this.">Toggle
            Me!</button>
        <button type="button" class="btn btn-primary" data-bs-toggle="popover" title="Popover Right"
            onclick="progressClick()" data-bs-placement="right"
            data-bs-content="This is demo of popover and Toggle button to display and hide this.">Toggle Me!
    </div>
    <br><br>
    <div class="progress mx-2 rounded-5">
        <div id="Pbar" class="progress-bar progress-bar-striped progress-bar-animated"></div>
    </div>

    <br><br><br>
    <div class="mx-2">
        <div class="progress rounded-5">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%;">100%</div>
        </div>
        <br>
        <div class="progress mb-5">
            <div class="progress-bar progress-bar-striped bg-success" style="width: 70%;">70%</div>
        </div>
    </div>
</body>
<script>
    var tooltipList = [].slice.call(document.querySelectorAll(`[data-bs-toggle="tooltip"]`))
    var tooltip = tooltipList.map(function (tooltip1) {
        return new bootstrap.Tooltip(tooltip1);
    });

    var popoverList = [].slice.call(document.querySelectorAll(`[data-bs-toggle="popover"]`));
    var singlePopover = popoverList.map(function (popOver1) {
        return new bootstrap.Popover(popOver1);
    });

    let value = 0;
    function progressClick() {
        let progress = document.getElementById("Pbar");
        if (value != 100) {
            value += 25;
            progress.style.width = `${value}%`;
            progress.textContent = `${value}%`;
        }

    }
</script>

</html>
