<!DOCTYPE html>
<html lang="en">

<head>
    <title>Day 7 - Toasts, Custom Theme, Icons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />
    <style>
        :root {
            --bs-secondary: rgb(142, 18, 124);
        }

        .toast {
            background-color: white;
            color: black;
            border: none;
            border-left: 3px solid var(--bs-secondary);
        }

        #btnToast {
            background-color: rgb(142, 18, 124);
            border: none;
        }
    </style>
</head>

<body class="text-center">
    <br>
    <button id="btnToast" class="btn btn-primary mb-3">
        <i class="bi-bell-fill"></i> Show Message
    </button>
    <br>
    <i class="bi bi-globe fs-2" style="color: #007bff;"></i>
    <p class="h6 fw-normal"><i class="bi bi-hand-index-thumb fs-2" style="color: #007bff;"></i>
        Click Show Message Button to appear Message.
    </p>
    <div class="toast-container">
        <div class="toast bg-custom btn-close-whit position-fixed top-0 end-0">
            <div class="toast-header border-0 d-flex justify-content-between">
                <p class="h6"><i class="bi bi-check-circle-fill" style="font-size:16px; color: #09ff00;"></i>
                    Success
                </p>
                <button class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body text-start mt-1">
                <p class="mb-0"><i class="bi bi-envelope align-middle" style="font-size: 24px; color: #007bff;"></i>
                    Your Message is Displayed Successfully.</p>
            </div>
        </div>
    </div>
</body>
<script>
    document.getElementById("btnToast").addEventListener('click', function () {
        var toastall = [].slice.call(document.querySelectorAll('.toast'));
        var toastList = toastall.map(function (toastE1) {
            return new bootstrap.Toast(toastE1);
        });
        toastList.forEach(toast => toast.show());
    });

</script>

</html>
