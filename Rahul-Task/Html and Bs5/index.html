<!DOCTYPE html>
<html lang="en">

<head>
    <title>JS Day 11 Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="bg-light text-dark rounded-3 shadow-lg border border-secondary-subtle p-5" style="width:350px;">
            <h2 class="text-center mb-4">Login</h2>
            <form action="logout.html">
                <div class="mb-3">
                    <label for="LoginEmail" class="form-label">Email: </label>
                    <input id="LoginEmail" type="email" inputmode="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="LoginPass" class="form-label">Password: </label>
                    <input id="LoginPass" type="password" class="form-control" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary mt-3">Login</button>
                </div>
                <div class="text-center mt-3">
                    Don't have account?
                    <a href="" type="button" data-bs-toggle="modal" data-bs-target="#register">Register</a>
                </div>
            </form>
        </div>
    </div>

    <div id="register" class="modal modal-xl modal-md fade">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="margin:0px;">
                <div class="modal-body bg-light text-dark rounded-3">

                    <h2 class="text-center mt-4">Registration Form</h2>
                    <button id="btnClose" type="button" class="btn-close position-absolute top-0 end-0 m-4"
                        data-bs-dismiss="modal"></button>

                    <form action="Success.html" class="px-5 pt-4">
                        <div class="row g-3">
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Fname" class="form-label">First Name: </label>
                                <input id="Fname" type="text" class="form-control" maxlength="50" required>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Email" class="form-label">Email: </label>
                                <input id="Email" type="email" inputmode="email" class="form-control" maxlength="50"
                                    required>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Pass" class="form-label">Password: </label>
                                <input id="Pass" type="password" class="form-control" maxlength="16" required>
                            </div>

                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="ConfirmPas" class="form-label">Confirm Password: </label>
                                <input id="ConfirmPas" type="password" class="form-control" maxlength="16" required>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Address" class="form-label">Address: </label>
                                <textarea name="Address" id="Address" class="form-control" rows="2" maxlength="100"
                                    required></textarea>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Gender" class="form-label">Gender: </label>
                                <div class="col">
                                    <div class="form-check form-check-inline">
                                        <input id="Male" name="gender" type="radio" value="M" class="form-check-input"
                                            style="border:1.5px solid lightgray;" required>
                                        <label for="Gender Male">Male</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input id="Female" name="gender" type="radio" value="F" class="form-check-input"
                                            style="border:1.5px solid lightgray;" required>
                                        <label for="Gender Female">Female</label>
                                    </div>
                                </div>
                            </div>

                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Age" class="form-label">Age: </label>
                                <input id="Age" type="text" class="form-control" maxlength="2"
                                    oninput="this.value = this.value.replace(/[^0-9]/g,'')" required>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Dob" class="form-label">Date Of Birth: </label>
                                <input id="Dob" type="date" class="form-control" required>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="birthTime" class="form-label">Birth Time: </label>
                                <input type="time" id="birthTime" class="form-control" required>
                            </div>

                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Hobbies" class="form-label">Hobbies: </label>
                                <div class="col">
                                    <div class="form-check form-check-inline">
                                        <input id="chkSupports" type="checkbox" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Supports">Supports</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input id="chkReading" type="checkbox" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Reading">Reading</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input id="chkGames" type="checkbox" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Games">Games</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Country" class="form-label">Select Country:</label>
                                <select id="Country" class="form-select" required>
                                    <option value="">--select Country--</option>
                                    <option value="1">India</option>
                                    <option value="2">Russia</option>
                                    <option value="3">Japan</option>
                                </select>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="State" class="form-label">State:</label>
                                <select id="State" class="form-select" required>
                                    <option value="">--Select State--</option>
                                    <option value="1">Gujarat</option>
                                    <option value="2">Maharashtra</option>
                                    <option value="3">Moscow Oblast</option>
                                    <option value="4">Leningrad Oblast</option>
                                    <option value="5">Kanto</option>
                                    <option value="6">Kansai</option>
                                </select>
                            </div>

                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="City" class="form-label">Select City:</label>
                                <select id="City" class="form-select" required>
                                    <option value="">--Select City--</option>
                                    <option value="1">Ahmedabad</option>
                                    <option value="2">Mumbai</option>
                                    <option value="3">Saint Petersburg</option>
                                    <option value="4">Gatchina</option>
                                    <option value="5">Kyoto</option>
                                    <option value="6">Tokyo</option>
                                </select>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Phone" class="form-label">Phone Number:</label>
                                <div class="input-group">
                                    <input id="Phone" type="tel" inputmode="numeric" class="form-control" maxlength="10"
                                        oninput="this.value = this.value.replace(/[^0-9]/g,'')" required>
                                </div>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Color" class="form-label">Choose Your color: </label>
                                <input id="Color" type="color" class="form-control" required>
                            </div>

                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Search" class="form-label">Search: </label>
                                <input id="Search" type="search" class="form-control" maxlength="100" required>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Range" class="form-label">Rate (0-10): </label>
                                <input id="Range" type="range" class="form-control" min="0" max="10" value="5" required>
                            </div>
                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="Url" class="form-label">Website Url: </label>
                                <input id="Url" type="text" class="form-control" required>
                            </div>

                            <div class="col-sm-12 col-md-6 col-lg-4">
                                <label for="File" class="form-label">Upload : </label>
                                <input id="File" type="file" class="form-control" accept=".png, .jpg, .jpeg, .gif"
                                    required>
                            </div>
                            <div class="col-12 col-sm-4 text-center text-sm-start">
                                <img id="ImgPreview" src="" alt="Image Preview" loading="lazy"
                                    style="width: 60px; height: 60px; display: none;">
                            </div>
                        </div>

                        <div class="mt-3 me-3">
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary me-3">Submit</button>
                                <button type="reset" class="btn btn-secondary">Reset</button>
                            </div>
                        </div>
                        <h6 class="text-center pb-2">
                            <label for="display">Do you have already account?
                                <a href="index.html" data-bs-dismiss="modal">Login</a>
                            </label>
                        </h6>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
