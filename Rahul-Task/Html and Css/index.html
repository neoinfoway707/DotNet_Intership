<!DOCTYPE html>
<html lang="en">

<head>
    <title>Html with Css Task</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="login" style="width:350px;">
            <h2 class="text-center margin-bottom">Login</h2>
            <form action="logout.html">
                <div class="margin-bottom">
                    <label for="LoginEmail" class="label">Email: </label>
                    <input id="LoginEmail" type="email" inputmode="email" class="text-control" required>
                </div>
                <div class="margin-bottom">
                    <label for="LoginPass" class="label">Password: </label>
                    <input id="LoginPass" type="password" class="text-control" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="loginbtn margin-top">Login</button>
                </div>
                <div class="text-center margin-top">
                    Don't have an account?
                    <a href="#register" type="button">Register</a>
                </div>
            </form>
        </div>
    </div>

    <div id="register" class="registerModal">
        <div class="register-dialog">
            <div class="register-content" style="margin:0px;">
                <div class="register-body">

                    <h2 class="text-center" style="font-size: 2rem;">Registration Form</h2>
                    <a id="btnClose" href="" class="register-Close">X</a>

                    <form action="Success.html" class="register-form">
                        <div class="register-row">
                            <div class="register-col">
                                <label for="Fname" class="label">First Name: </label>
                                <input id="Fname" type="text" class="text-control" maxlength="50" required>
                            </div>
                            <div class="register-col">
                                <label for="Email" class="label">Email: </label>
                                <input id="Email" type="email" inputmode="email" class="text-control" maxlength="50"
                                    required>
                            </div>
                            <div class="register-col">
                                <label for="Pass" class="label">Password: </label>
                                <input id="Pass" type="password" class="text-control" maxlength="16" required>
                            </div>


                            <div class="register-col">
                                <label for="ConfirmPas" class="label">Confirm Password: </label>
                                <input id="ConfirmPas" type="password" class="text-control" maxlength="16" required>
                            </div>
                            <div class="register-col">
                                <label for="Address" class="label">Address: </label>
                                <textarea name="Address" id="Address" class="text-control" rows="2" maxlength="100"
                                    required></textarea>
                            </div>
                            <div class="register-col">
                                <label for="Gender" class="label">Gender: </label>
                                <div class="col">
                                    <div class="form-check form-check-inline">
                                        <input id="Male" name="gender" type="radio" value="M" class="form-check-input"
                                            style="border:1.5px solid lightgray;" required>
                                        <label for="Gender Male">Male</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input id="Female" name="gender" type="radio" value="F" class="form-check-input"
                                            style="border:1.5px solid lightgray;" required>
                                        <label for="Gender Female">Female</label>
                                    </div>
                                </div>
                            </div>

                            <div class="register-col">
                                <label for="Age" class="label">Age: </label>
                                <input id="Age" type="text" class="text-control" maxlength="2"
                                    oninput="this.value = this.value.replace(/[^0-9]/g,'')" required>
                            </div>
                            <div class="register-col">
                                <label for="Dob" class="label">Date Of Birth: </label>
                                <input id="Dob" type="date" class="text-control" required>
                            </div>
                            <div class="register-col">
                                <label for="birthTime" class="label">Birth Time: </label>
                                <input type="time" id="birthTime" class="text-control" required>
                            </div>

                            <div class="register-col">
                                <label for="Hobbies" class="label">Hobbies: </label>
                                <div class="col">
                                    <div class="form-check form-check-inline">
                                        <input id="chkSupports" type="checkbox" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Supports">Supports</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input id="chkReading" type="checkbox" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Reading">Reading</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input id="chkGames" type="checkbox" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Games">Games</label>
                                    </div>
                                </div>
                            </div>
                            <div class="register-col">
                                <label for="Country" class="label">Select Country:</label>
                                <select id="Country" class="text-control" required>
                                    <option value="">--select Country--</option>
                                    <option value="1">India</option>
                                    <option value="2">Russia</option>
                                    <option value="3">Japan</option>
                                </select>
                            </div>
                            <div class="register-col">
                                <label for="State" class="label">State:</label>
                                <select id="State" class="text-control" required>
                                    <option value="">--Select State--</option>
                                    <option value="1">Gujarat</option>
                                    <option value="2">Maharashtra</option>
                                    <option value="3">Moscow Oblast</option>
                                    <option value="4">Leningrad Oblast</option>
                                    <option value="5">Kanto</option>
                                    <option value="6">Kansai</option>
                                </select>
                            </div>

                            <div class="register-col">
                                <label for="City" class="label">Select City:</label>
                                <select id="City" class="text-control" required>
                                    <option value="">--Select City--</option>
                                    <option value="1">Ahmedabad</option>
                                    <option value="2">Mumbai</option>
                                    <option value="3">Saint Petersburg</option>
                                    <option value="4">Gatchina</option>
                                    <option value="5">Kyoto</option>
                                    <option value="6">Tokyo</option>
                                </select>
                            </div>
                            <div class="register-col">
                                <label for="Phone" class="label">Phone Number:</label>
                                <div class="input-group">
                                    <input id="Phone" type="tel" inputmode="numeric" class="text-control" maxlength="10"
                                        oninput="this.value = this.value.replace(/[^0-9]/g,'')" required>
                                </div>
                            </div>
                            <div class="register-col">
                                <label for="Color" class="label">Choose Your color: </label>
                                <input id="Color" type="color" class="text-control" required
                                    style="height: 2.29rem;padding:0.4rem;">
                            </div>

                            <div class="register-col">
                                <label for="Search" class="label">Search: </label>
                                <input id="Search" type="search" class="text-control" maxlength="100" required>
                            </div>
                            <div class="register-col">
                                <label for="Range" class="label">Rate (0-10): </label>
                                <input id="Range" type="range" class="text-control" min="0" max="10" value="5" required>
                            </div>
                            <div class="register-col">
                                <label for="Url" class="label">Website Url: </label>
                                <input id="Url" type="text" class="text-control" required>
                            </div>

                            <div class="register-col">
                                <label for="File" class="label">Upload : </label>
                                <input id="File" type="file" class="text-control" accept=".png, .jpg, .jpeg, .gif"
                                    required>
                            </div>
                        </div>

                        <div class="buttons">
                            <button type="submit" class="submit">Submit</button>
                            <button type="reset" class="clear">Reset</button>
                        </div>
                        <h4 class="text-center padding-b">Do you have already account?
                            <a href="#">Login</a>
                        </h4>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
