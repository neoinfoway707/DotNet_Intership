<!DOCTYPE html>
<html lang="en">

<head>
    <title>JS Day 11 Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .invalid-feedback {
            height: 18px;
        }

        .form-control.is-invalid,
        .form-select.is-invalid {
            background-image: none !important;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;height:100px;">
        <div class="bg-light text-dark shadow-lg rounded-3 border border-secondary-subtle p-5" style="width:350px;">
            <h2 class="text-center mb-4">Login</h2>
            <form id="myFormLogin" onsubmit="return loginValidation()">
                <div class="mb-2">
                    <label for="LoginEmail" class="form-label">Email:</label>
                    <input id="LoginEmail" type="text" class="form-control" autocomplete="email">
                    <div id="LoginEmailErr" class="invalid-feedback d-flex" style="min-height:20px;">
                    </div>

                </div>
                <div class="mb-2">
                    <label for="LoginPass" class="form-label">Password: </label>
                    <div class="input-group">
                        <input id="LoginPass" type="password" class="form-control" style="margin-right: 1px;">
                        <button id="Show" class="btn btn-light border" type="button"
                            onclick="togglePassword('LoginPass')">👁</button>
                    </div>
                    <div id="LoginPassErr" class="invalid-feedback d-flex" style="min-height:20px;">
                    </div>

                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary mt-3">Login</button>
                </div>
                <div class="text-center mt-3">
                    Don't have account?
                    <a href="#" onclick="showRegister()">Register</a>
                </div>
            </form>
        </div>
    </div>

    <div id="register" class="d-none position-fixed top-0 start-0 w-100 h-100 align-items-start justify-content-center"
        style="background: rgba(0,0,0,0.7); z-index: 9999; overflow-y: auto;">

        <div class="container" style="margin: auto; padding: 16px 12px;">

            <div class="bg-light text-dark shadow-lg rounded-3">

                <div class="card-body p-4 pb-2 position-relative">

                    <h2 class="text-center mb-4">Registration Form</h2>
                    <button id="btnClose" type="button" class="btn-close position-absolute top-0 end-0 m-4"
                        onclick="hideRegister()"></button>

                    <form id="myFormReg" onsubmit="return validation()">

                        <div class="row g-3 mb-1">
                            <div class="col-12 col-md-4">
                                <label for="Fname" class="form-label">First Name: </label>
                                <input id="Fname" type="text" class="form-control" maxlength="50"
                                    autocomplete="given-name">
                                <div id="FnameErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>

                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Email" class="form-label">Email: </label>
                                <input id="Email" type="text" inputmode="email" class="form-control" maxlength="50"
                                    autocomplete="email">
                                <div id="EmailErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Pass" class="form-label">Password: </label>
                                <div class="input-group">
                                    <input id="Pass" type="password" class="form-control" maxlength="16">
                                    <button class="btn btn-light border" type="button"
                                        onclick="togglePassword('Pass')">👁</button>
                                </div>
                                <div id="PassErr" class="invalid-feedback d-block" style="min-height:20px;"> </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-1">
                            <div class="col-12 col-md-4">
                                <label for="ConfirmPas" class="form-label">Confirm Password: </label>
                                <div class="input-group">
                                    <input id="ConfirmPas" type="password" class="form-control" maxlength="16">
                                    <button class="btn btn-light border" type="button"
                                        onclick="togglePassword('ConfirmPas')">👁</button>
                                </div>
                                <div id="ConfirmPasErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Address" class="form-label">Address: </label>
                                <textarea name="Address" id="Address" class="form-control" rows="2"
                                    maxlength="100"></textarea>
                                <div id="AddressErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Gender" class="form-label">Gender: </label>
                                <div class="col">
                                    <div class="form-check form-check-inline">
                                        <input id="Male" name="gender" type="radio" value="M" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Gender Male">Male</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input id="Female" name="gender" type="radio" value="F" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Gender Female">Female</label>
                                    </div>
                                </div>
                                <div id="MaleErr" class="invalid-feedback d-block" style="min-height:20px;"> </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-1">
                            <div class="col-12 col-md-4">
                                <label for="Age" class="form-label">Age: </label>
                                <input id="Age" type="text" class="form-control" maxlength="3"
                                    oninput="this.value = this.value.replace(/[^0-9]/g,'')" inputmode="numeric">
                                <div id="AgeErr" class="invalid-feedback d-block" style="min-height:20px;"> </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Dob" class="form-label">Date Of Birth: </label>
                                <input id="Dob" type="date" class="form-control">
                                <div id="DobErr" class="invalid-feedback d-block" style="min-height:20px;"> </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="birthTime" class="form-label">Birth Time: </label>
                                <input type="time" id="birthTime" class="form-control"></textarea>
                                <div id="birthTimeErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-1">
                            <div class="col-12 col-md-4">
                                <label for="Hobbies" class="form-label">Hobbies: </label>
                                <div class="col">
                                    <div class="form-check form-check-inline">
                                        <input id="chkSupports" type="checkbox" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Supports">Supports</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input id="chkReading" type="checkbox" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Reading">Reading</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input id="chkGames" type="checkbox" class="form-check-input"
                                            style="border:1.5px solid lightgray;">
                                        <label for="Games">Games</label>
                                    </div>
                                </div>
                                <div id="chkSupportsErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Country" class="form-label">Select Country:</label>
                                <select id="Country" class="form-select" onchange="funCountry()">
                                    <option value="">--select Country--</option>
                                    <option value="1">India</option>
                                    <option value="2">Russia</option>
                                    <option value="3">Japan</option>
                                </select>
                                <div id="CountryErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="State" class="form-label">State:</label>
                                <select id="State" class="form-select" onchange="funState()">
                                    <option value="">--Select State--</option>
                                </select>
                                <div id="StateErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-1">
                            <div class="col-12 col-md-4">
                                <label for="City" class="form-label">Select City:</label>
                                <select id="City" class="form-select">
                                    <option value="">--Select City--</option>
                                </select>
                                <div id="CityErr" class="invalid-feedback d-block" style="min-height:20px;"> </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Phone" class="form-label">Phone Number:</label>
                                <div class="input-group">
                                    <input id="PhoneCode" inputmode="numeric" class="form-control"
                                        style="max-width:65px;" readonly>
                                    <input id="Phone" type="tel" inputmode="numeric" class="form-control" maxlength="10"
                                        oninput="this.value = this.value.replace(/[^0-9]/g,'')">
                                </div>
                                <div id="PhoneErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Color" class="form-label">Choose Your color: </label>
                                <input id="Color" type="color" class="form-control">
                                <div id="ColorErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-1">
                            <div class="col-12 col-md-4">
                                <label for="Search" class="form-label">Search: </label>
                                <input id="Search" type="search" class="form-control" maxlength="100">
                                <div id="SearchErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Range" class="form-label">Rate: (<span id="RangeValue">0</span>/10)</label>
                                <input id="Range" type="range" class="form-control" min="0" max="10" value="0">
                                <div id="RangeErr" class="invalid-feedback d-block" style="min-height:20px;">
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="Url" class="form-label">Website Url: </label>
                                <input id="Url" type="text" class="form-control">
                                <div id="UrlErr" class="invalid-feedback d-block" style="min-height:20px;"> </div>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-12 col-md-4">
                                <label for="File" class="form-label">Upload : </label>
                                <input id="File" type="file" class="form-control" accept=".png, .jpg, .jpeg, .gif">
                            </div>
                            <div class="col-12 col-sm-4 text-center text-sm-start">
                                <img id="ImgPreview" src="" alt="Image Preview" loading="lazy"
                                    style="width: 60px; height: 60px; display: none;">
                            </div>
                            <div id="FileErr" class="invalid-feedback d-block" style="min-height:20px;"> </div>
                        </div>

                        <div class="me-3">
                            <div class="text-end mt-1">
                                <button type="submit" class="btn btn-primary me-3">Submit</button>
                                <button type="reset" class="btn btn-secondary" onclick="clearAllErrors()">Reset</button>
                            </div>
                        </div>
                        <h6 class="text-center">
                            <label for="display" class="mt-1 mb-2">Do you have already account?
                                <a href="index.html">Login</a>
                            </label>
                        </h6>
                    </form>

                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
