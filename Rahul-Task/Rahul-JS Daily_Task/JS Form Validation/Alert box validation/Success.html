<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registration Success</title>
</head>

<body>
    <div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="shadow-lg border border-secondary-subtle rounded-3 w-50 text-center p-4" style="width:3050px;">
            <h2 class="text-success mb-4">Registration Successful!</h2>
            <p class="text-secondary">You have successfully registered. Welcome aboard! You can now login with your
                credentials.</p>
            <p class="text-secondary" id="userMsg"> </p>
            <div class="d-flex gap-2 justify-content-center mt-3">
                <a href="index.html" class="btn btn-primary">Go to Login</a>
                <a href="index.html" class="btn btn-outline-secondary">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get("userEmail");
        if (email) {
            document.getElementById("userMsg").textContent = `Welcome, ${email}! You have successfully registered.`;
        }
    </script>
</body>

</html>
